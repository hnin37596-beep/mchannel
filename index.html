<script>
    // Telegram Web App ကနေတဆင့် ဝင်လာတဲ့ User ရဲ့ ID ကို ယူခြင်း
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    const user = tg.initDataUnsafe?.user;
    const userId = user ? user.id : null;

    // လစဥ်ကြေးပေးထားပြီးသား User ID စာရင်း (Admin က ဒီမှာ လာဖြည့်ပေးရပါမယ်)
    const allowedUserIDs = [7959310620, 1953715323]; // ဥပမာ ID များ

    if (userId && allowedUserIDs.includes(userId)) {
        // ID စာရင်းထဲ ပါရင် ဗီဒီယိုပြမယ်
        var video = document.getElementById('video');
        var videoSrc = 'https://hnin37596-beep.github.io/mchannel/';
        
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    } else {
        // ID စာရင်းထဲ မပါရင် သတိပေးချက်ပြမယ်
        document.body.innerHTML = "<h2 style='color:white; text-align:center; font-family:sans-serif;'>❌ တောင်းပန်ပါတယ်၊ သင်သည် လစဥ်ကြေးပေးသွင်းထားခြင်း မရှိသေးပါ သို့မဟုတ် Member မဟုတ်ပါ။</h2>";
    }
</script>
